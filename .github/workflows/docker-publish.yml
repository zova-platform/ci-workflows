# Reusable Docker build: build, scan with Trivy, then push to ghcr.io.
#
# Usage (in a service repo):
#   jobs:
#     image:
#       if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
#       uses: zova-platform/ci-workflows/.github/workflows/docker-publish.yml@v1
#       permissions:
#         contents: read
#         packages: write
name: docker-publish

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64
      push:
        description: Push the image after a clean scan
        type: boolean
        default: true
      fail-on-severity:
        description: Trivy severities that fail the build
        type: string
        default: CRITICAL
    outputs:
      image:
        description: Image name without tag
        value: ${{ jobs.build.outputs.image }}
      version:
        description: Primary tag (short git SHA)
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build, scan, push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build for scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ steps.vars.outputs.image }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        # trivy-action tags were hijacked in March 2026: pin this to a full commit SHA
        # of a verified release (see README) before tagging v1.0.0.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:scan
          severity: ${{ inputs.fail-on-severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.vars.outputs.sha }}
          cache-from: type=gha
